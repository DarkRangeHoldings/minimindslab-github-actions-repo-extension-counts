name: "File Extension Counts"
description: "Summarize repository file extensions from a supplied path list and return deterministic counts for lightweight CI reporting."
inputs:
  payload:
    description: "JSON payload consumed by the action"
    required: true
outputs:
  result:
    description: "Compact JSON result produced by the action"
runs:
  using: "node24"
  main: "index.js"
branding:
  icon: "check-circle"
  color: "blue"
